project:
  name: CardioVision-AI
  version: 0.1.0
  environment: development

data:
  raw_dir: data/raw/ptbxl
  interim_dir: data/interim
  processed_dir: data/processed

image:
  target_size: 224
  channels: 3

model:
  task: binary_classification
  classes:
    - non_mi
    - mi

cnn:
  image_size: 224
  channels: 3
  batch_size: 32
  num_classes: 2
  learning_rate: 0.0001
  seed: 42

  augmentation:
    rotation: 5
    zoom: 0.05
    width_shift: 0.02
    height_shift: 0.02